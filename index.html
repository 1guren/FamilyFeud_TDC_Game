<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Feud</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- INTRO -->
    <section id="intro-screen" class="screen">
      <div class="stage-lights">
        <div class="beam b1"></div>
        <div class="beam b2"></div>
        <div class="beam b3"></div>
        <div class="beam b4"></div>
        <div id="bulbs"></div>
      </div>

      <div class="intro-content">
        <img src="logo.png" alt="Family Feud" class="game-logo" />

        <!-- TEAM NAMES: type them here before starting (blank = TEAM 1 / TEAM 2) -->
        <div class="team-setup">
          <input
            id="team-one-input"
            type="text"
            maxlength="14"
            placeholder="TEAM 1"
            autocomplete="off"
            aria-label="Team 1 name"
          />
          <span class="vs">VS</span>
          <input
            id="team-two-input"
            type="text"
            maxlength="14"
            placeholder="TEAM 2"
            autocomplete="off"
            aria-label="Team 2 name"
          />
        </div>

        <button id="start-game-btn" class="primary-btn">START GAME</button>
      </div>
    </section>

    <!-- GAME -->
    <section id="game-screen" class="screen hidden">
      <header class="top-bar">
        <div class="team-card">
          <div id="team-one-name" class="team-name">TEAM 1</div>
          <div id="team-one-score" class="team-score">0</div>
        </div>

        <div class="center-info">
          <div class="round-label">
            <div>
              ROUND <span id="round-number">1</span> ·
              <span id="round-title"></span>
            </div>
            <small
              >QUESTION <span id="question-number">1</span> /
              <span id="question-total">3</span></small
            >
          </div>
          <div id="control-status" class="control-status"><strong>FACE-OFF</strong><span>WAITING FOR BUZZER</span></div>
          <div id="question-bank" class="question-bank"><span>QUESTION BANK</span><strong>0</strong><small></small></div>
        </div>

        <div class="team-card">
          <div id="team-two-name" class="team-name">TEAM 2</div>
          <div id="team-two-score" class="team-score">0</div>
        </div>
      </header>

      <h1 id="question">Loading question...</h1>

      <section id="answers-container" class="answers-container"></section>

      <footer class="bottom-bar">
        <button id="reveal-remaining-btn" class="reveal-remaining-btn hidden">REVEAL REMAINING ANSWERS</button>
        <div class="strike-section">
          <div class="strike"></div>
          <div class="strike"></div>
          <div class="strike"></div>
        </div>
        <button id="next-btn" class="next-btn">
          <span id="next-label">NEXT QUESTION</span>
          <span class="arrow">&#9654;</span>
        </button>
      </footer>
    </section>

    <!-- RESULT -->
    <section id="result-screen" class="screen hidden">
      <div id="result-label" class="result-label">THE WINNER IS</div>
      <div id="winner-name" class="winner-name"></div>
      <div class="final-scores">
        <div class="final-card">
          <span id="final-one-name">TEAM 1</span><b id="final-one">0</b>
        </div>
        <div class="final-card">
          <span id="final-two-name">TEAM 2</span><b id="final-two">0</b>
        </div>
      </div>
    </section>

    <!-- BIG X + MESSAGE OVERLAYS -->
    <div id="strike-overlay" class="strike-overlay"></div>
    <div id="message-overlay" class="message-overlay"></div>

    <!-- HIDDEN HOST PANEL (press H to show/hide) -->
    <div id="host-panel" class="host-panel">
      <button id="team-one-btn">T1 Buzz (A)</button>
      <button id="team-two-btn">T2 Buzz (L)</button>
      <button id="strike-btn">Wrong / X (X)</button>
      <button id="reveal-remaining-host-btn">Reveal Remaining (V)</button>
      <button id="undo-btn">Undo (U)</button>
      <button id="next-question-host-btn">Next Question (N)</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
